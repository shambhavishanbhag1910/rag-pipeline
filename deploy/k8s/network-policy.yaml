apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-rag-api
spec:
  podSelector:
    matchLabels:
      app: enterprise-rag-api
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
