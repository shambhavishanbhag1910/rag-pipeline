apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-rag-api
  labels:
    app: enterprise-rag-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-rag-api
  template:
    metadata:
      labels:
        app: enterprise-rag-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: enterprise-rag-pipeline:1.0.0
          command:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: enterprise-rag-config
            - secretRef:
                name: enterprise-rag-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
