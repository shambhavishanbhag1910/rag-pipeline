[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-pipeline"
version = "1.0.0"
description = "Deployment-ready enterprise RAG pipeline with pgvector hybrid search, semantic caching, and Ragas evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Enterprise RAG Project"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "asyncpg>=0.30,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "pgvector>=0.3.6,<1.0",
  "sentence-transformers>=3.3,<6.0",
  "numpy>=1.26,<3.0",
  "openai>=1.60,<3.0",
  "httpx>=0.28,<1.0",
  "structlog>=24.4,<26.0",
  "prometheus-client>=0.21,<1.0",
  "python-multipart>=0.0.18,<1.0",
  "pypdf>=5.1,<7.0",
  "orjson>=3.10,<4.0",
  "ragas==0.4.3",
  "rapidfuzz>=3.10,<4.0",
  "pandas>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.14,<3.0",
  "types-python-dateutil>=2.9,<3.0",
]

[project.scripts]
rag-seed = "scripts.seed:main"
rag-evaluate = "scripts.evaluate:main"
rag-smoke-test = "scripts.smoke_test:main"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires PostgreSQL/pgvector"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["migrations/"]
